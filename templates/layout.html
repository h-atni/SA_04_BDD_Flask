<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Concession BMW{% endblock %}</title>
  {% block stylesheets %}
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/css/bootstrap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='mes_styles.css') }}">
  {% endblock %}
</head>
<body>
{% include "_nav.html" %}
<div class="container mt-3">
  {% for categorie, message in get_flashed_messages(with_categories=true) %}
    <div class="alert {{ categorie }}">{{ message }}</div>
  {% endfor %}
  {% block body %}{% endblock %}
</div>

{% block scripts %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
</body>
</html>
