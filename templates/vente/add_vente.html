{% extends "layout.html" %}
{% block title %}Ajouter une vente{% endblock %}
{% block body %}
<h2>Ajouter une vente</h2>
<form action="/vente/add" method="post">
  <div class="mb-3">
    <label class="form-label">Date de vente</label>
    <input class="form-control" type="date" name="date_vente" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Prix final (€)</label>
    <input class="form-control" type="number" step="0.01" name="prix_final" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Remise parrainage (€)</label>
    <input class="form-control" type="number" step="0.01" name="remise_parrainage" value="0">
  </div>
  <div class="mb-3">
    <label class="form-label">Mode de paiement</label>
    <input class="form-control" type="text" name="mode_paiement">
  </div>
  <div class="mb-3">
    <label class="form-label">Voiture</label>
    <select class="form-select" name="voiture_id" required>
      <option value="" disabled selected>-- choisir une voiture --</option>
      {% for v in voitures %}
        <option value="{{ v.id_voiture }}">
          {{ v.nom_modele }} {{ v.libelle_couleur }} - {{ v.libelle_etat }} - {{ v.kilometrage }} km ({{ v.id_voiture }})
        </option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Employé</label>
    <select class="form-select" name="employe_id" required>
      <option value="" disabled selected>-- choisir un employé --</option>
      {% for e in employes %}
        <option value="{{ e.id }}">{{ e.nom }} {{ e.prenom }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Client</label>
    <select class="form-select" name="client_id" required>
      <option value="" disabled selected>-- choisir un client --</option>
      {% for c in clients %}
        <option value="{{ c.id }}">{{ c.nom }} {{ c.prenom }}</option>
      {% endfor %}
    </select>
  </div>
  <button class="btn btn-outline-success">Ajouter</button>
  <a class="btn btn-outline-secondary" href="/vente/show">Annuler</a>
</form>
{% endblock %}
